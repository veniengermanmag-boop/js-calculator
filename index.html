<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPredictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="topbar">
      <span class="logo">▾ LeadPredictor</span>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <label>Language
          <select id="language"><option>English</option><option>Bulgarian</option></select>
        </label>
        <label>Currency
          <select id="currency"><option>$ US Dollar</option><option>€ Euro</option></select>
        </label>
        <label>Campaign Start
          <input type="date" id="campaignStart" value="2026-05-01">
        </label>
        <label>Campaign End
          <input type="date" id="campaignEnd" value="2026-11-04">
        </label>
        <label>Total Revenue
          <input type="number" id="totalRevenue" value="10000">
        </label>
        <label>Avg. Order Value
          <input type="number" id="avgOrderValue" value="1000">
        </label>
      </aside>

      <main class="chart-area">
        <div class="bars" id="bars"></div>
      </main>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-label">📁 Prospects <span>100%</span></div>
          <div class="stat-value" id="prospectsValue">125</div>
          <div class="progress"><div class="progress-fill" style="width:100%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">👤 Leads <span>20%</span></div>
          <div class="stat-value" id="leadsValue">25</div>
          <div class="progress"><div class="progress-fill" style="width:20%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">⏳ Customers <span>8%</span></div>
          <div class="stat-value" id="customersValue">10</div>
          <div class="progress"><div class="progress-fill" style="width:8%"></div></div>
        </div>
      </section>
    </div>

    <div class="sliders">
      <label>Lead Response Rate
        <input type="range" id="leadRate" min="0" max="100" value="60">
        <span id="leadRateVal">60%</span>
      </label>
      <label>Prospect Response Rate
        <input type="range" id="prospectRate" min="0" max="100" value="26">
        <span id="prospectRateVal">26%</span>
      </label>
    </div>
  </div>
  <footer style="text-align:center; margin-top:20px; padding:10px;">
  <a href="https://github.com/veniengermanmag-boop/js-calculator" target="_blank" style="color:#9aa5c0; text-decoration:none; font-size:0.85rem;">
    View source on GitHub ↗
  </a>
  </footer>
  <script src="script.js"></script>
</body>
</html>
